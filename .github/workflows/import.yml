name: Import project from zip
# Загрузите zip в корень репозитория и запустите этот workflow (Actions -> Import project from zip -> Run workflow)
on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Имя zip-файла в корне репозитория"
        required: true
        default: "FortPortClient-src.zip"
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sources with zip contents
        run: |
          set -e
          Z="${{ inputs.zip_name }}"
          test -f "$Z"
          mkdir /tmp/new && unzip -q "$Z" -d /tmp/new
          # если внутри одна папка-обёртка, заходим в неё
          if [ "$(ls -A /tmp/new | wc -l)" = "1" ] && [ -d "/tmp/new/$(ls /tmp/new)" ]; then SRC="/tmp/new/$(ls /tmp/new)"; else SRC=/tmp/new; fi
          # удаляем старое (кроме .git, .github и самого zip)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$Z" -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f "$Z"
          rm -rf .github_from_zip
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update sources from zip" || echo "nothing to commit"
          git push
      - name: Start build
        run: gh workflow run build.yml
        env:
          GH_TOKEN: ${{ github.token }}
