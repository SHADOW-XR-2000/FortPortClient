name: Release APK
# Собирает подписанный APK и публикует его как GitHub Release (тег build-N).
# Из этих релизов приложение берёт обновления (UpdateManager).
# Запускается только вручную (Actions -> Release APK -> Run workflow): импорт и push релиз не выпускают.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Что нового (показывается в окне обновления)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      # Ключ подписи. Вариант А (достаточно одного секрета SIGNING_PASSPHRASE): при первом запуске ключ
      # создаётся автоматически и сохраняется в ВЕТКЕ signing в зашифрованном виде (AES-256, пароль = секрет);
      # дальше берётся оттуда. Вариант Б: свой ключ через четыре секрета SIGNING_KEYSTORE_BASE64,
      # SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (приоритетнее).
      - name: Prepare signing key
        env:
          GH_TOKEN: ${{ github.token }}
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
          KS_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_BASE64" ] && [ -n "$KS_PASSWORD" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEY_PASSWORD" ]; then
            echo "$KS_BASE64" | base64 -d > "$KS"
            SP="$KS_PASSWORD"; AL="$KS_ALIAS"; KP="$KS_KEY_PASSWORD"
          elif [ -n "$PASS" ]; then
            if [ "${#PASS}" -lt 12 ]; then
              echo "::error::SIGNING_PASSPHRASE слишком короткий: нужно минимум 12 символов (ветка signing публична, пароль — единственная защита ключа)."
              exit 1
            fi
            ENC="$RUNNER_TEMP/release.jks.enc"
            if git fetch --depth=1 origin signing 2>/dev/null; then
              git show FETCH_HEAD:release.jks.enc > "$ENC"
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in "$ENC" -out "$KS" \
                || { echo "::error::Не удалось расшифровать ключ из ветки signing: неверный SIGNING_PASSPHRASE?"; exit 1; }
            else
              echo "Ветки signing нет — создаю новый ключ подписи"
              keytool -genkeypair -keystore "$KS" -alias fortport -keyalg RSA -keysize 2048 -validity 36500 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=FortPort Client, O=FortPort, C=RU"
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -in "$KS" -out "$ENC"
              D=$(mktemp -d)
              cp "$ENC" "$D/release.jks.enc"
              echo "Зашифрованный ключ подписи FortPortClient. Не удаляйте эту ветку: без неё обновления поверх установленного приложения станут невозможны." > "$D/README.txt"
              ( cd "$D" && git init -q -b signing && git config user.name github-actions && git config user.email actions@users.noreply.github.com \
                && git add -A && git commit -q -m "Encrypted signing key" \
                && git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signing )
            fi
            SP="$PASS"; AL="fortport"; KP="$PASS"
          else
            echo "::error::Нет данных для подписи. Добавьте секрет SIGNING_PASSPHRASE (см. README, раздел «Обновления»)."
            exit 1
          fi
          {
            echo "FP_KEYSTORE_FILE=$KS"
            echo "FP_KEYSTORE_PASSWORD=$SP"
            echo "FP_KEY_ALIAS=$AL"
            echo "FP_KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          N=${{ github.run_number }}
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "FortPortClient-$N.apk"
          [ -n "$NOTES" ] || NOTES="Обновление до версии $VN"
          gh release create "build-$N" "FortPortClient-$N.apk" \
            --target "$GITHUB_SHA" --title "$VN" --notes "$NOTES"
      - name: Delete old releases (keep 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" --cleanup-tag --yes || true
          done
